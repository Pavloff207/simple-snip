name: Feature request
description: Suggest an idea for Simple Snip.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to get done, more than the button you'd add.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Simple Snip help?
